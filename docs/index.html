<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo - Agentic Workflows</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>GitHub Agentic Workflows</h1>
    <p class="subtitle">Demo GitHub Community Day Peru 2026</p>

    <div class="buttons">
      <button id="btn-ok" onclick="showMessage()">
        Boton que funciona
      </button>

      <button id="btn-broken" onclick="showAlert()">
        Boton roto
      </button>

      <button id="btn-share" onclick="shareUrl()">
        Compartir
      </button>
    </div>

    <div id="counter">
      Clics: <span id="click-count">0</span>
    </div>

    <div id="message" class="message hidden">
      Hola desde el boton que funciona!
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
